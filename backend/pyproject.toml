[project]
name = "email-email-agent"
version = "0.1.0"
description = "FastAPI server for Gmail reading, LLM summarization, and categorization"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Gmail API
    "google-api-python-client>=2.118.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # LangChain + OpenAI
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2",

    # Data validation & config
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",

    # Secrets management
    "keyring>=25.0.0",

    # OpenAI SDK (direct — used for Whisper STT alongside langchain-openai)
    "openai>=1.0.0",

    # Form/file upload parsing (required by FastAPI UploadFile)
    "python-multipart>=0.0.9",

    # Utilities
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",

    # Database — relational
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Database — vector
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",

    # Document ingestion
    "pdfplumber>=0.11",
]

[project.scripts]
setup-secrets = "scripts.setup_secrets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts", "database"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
