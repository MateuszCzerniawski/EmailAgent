# Alembic configuration for email Email Agent
# DATABASE_URL is read from the environment in env.py — do NOT put credentials here.

[alembic]
script_location = database/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# Placeholder — overridden by env.py which reads DATABASE_URL from environment.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/emailagent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
