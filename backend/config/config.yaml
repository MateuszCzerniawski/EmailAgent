email_categories:
- work
- finance
- newsletter
- social
- promotions
- travel
- health
- legal
- spam
- other
gmail:
  max_results: 500
  query: ''
llm:
  provider: openai
  openai_model: gpt-4o-mini
  ollama_model: qwen2.5:3b
  ollama_base_url: http://localhost:11434
  temperature: 0.0
  max_tokens: 512
cache:
  enabled: true
  db_path: .cache/llm_cache.db
server:
  host: 127.0.0.1
  port: 8000
keyring:
  service_name: email-email-agent
  openai_key_name: openai_api_key
  gmail_token_key_name: gmail_refresh_token
  gmail_client_id_key_name: gmail_client_id
  gmail_client_secret_key_name: gmail_client_secret
